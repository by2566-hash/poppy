<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" width="1800" height="1080" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B3FC4"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #1F1F1F; }
      .subtitle { font-size: 15px; fill: #5A5A5A; }
      .lane { font-size: 18px; font-weight: 700; fill: #1F1F1F; }
      .laneMeta { font-size: 13px; fill: #5A5A5A; }
      .boxTitle { font-size: 15px; font-weight: 700; fill: #1F1F1F; }
      .boxMeta { font-size: 12.5px; fill: #4A4A4A; }
      .small { font-size: 11.5px; fill: #4A4A4A; }
      .edge { font-size: 12px; fill: #3A3A3A; }
      .accent { font-size: 12.5px; font-weight: 700; fill: #6B3FC4; }
      .tag { font-size: 11px; font-weight: 700; }
      .io { fill: #FFFFFF; stroke: #9A9A9A; stroke-width: 1.3; }
      .model { fill: #E8F0FE; stroke: #3B6FD8; stroke-width: 1.6; }
      .code { fill: #EDF5E8; stroke: #4F8A2E; stroke-width: 1.6; }
      .judge { fill: #FDF1E3; stroke: #D9822B; stroke-width: 1.6; }
      .human { fill: #F3E8FD; stroke: #6B3FC4; stroke-width: 1.6; }
      .ghost { fill: #F6F6F6; stroke: #C4C4C4; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .line { stroke: #4A4A4A; stroke-width: 1.8; fill: none; }
      .lineP { stroke: #6B3FC4; stroke-width: 2; fill: none; }
      .have { fill: #4F8A2E; }
      .build { fill: #D9822B; }
      .arm { fill: #6B3FC4; }
    </style>
  </defs>
  <rect width="1800" height="1080" fill="#FFFFFF"/>

  <text class="title" x="40" y="52">Phase 2 — An evaluation layer for a data-analysis agent</text>
  <text class="subtitle" x="40" y="80">The agent stays simple. The layer around it scores every run per step, finds and names failures, and turns findings into versioned changes that must prove themselves on a fixed set. Status tags: </text>
  <rect x="1385" y="66" width="10" height="10" class="have"/><text class="small" x="1400" y="76">exists (phase 1)</text>
  <rect x="1500" y="66" width="10" height="10" class="build"/><text class="small" x="1515" y="76">to build</text>
  <rect x="1585" y="66" width="10" height="10" class="arm"/><text class="small" x="1600" y="76">experimental arm</text>

  <!-- ===== Layer 1: the agent ===== -->
  <rect x="30" y="100" width="1740" height="200" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>
  <text class="lane" x="48" y="130">Layer 1 · the agent under evaluation (one OpenCode run, ≤ 15 steps, sandboxed: own folder, own data copy, no network)</text>

  <rect class="io" x="48" y="150" width="190" height="120" rx="8"/>
  <text class="boxTitle" x="62" y="175">Input</text>
  <text class="boxMeta" x="62" y="196">question</text>
  <text class="boxMeta" x="62" y="214">data dictionary</text>
  <text class="boxMeta" x="62" y="232">data file (2.27M crashes)</text>
  <text class="boxMeta" x="62" y="250">frozen prompt (hash)</text>

  <rect class="model" x="270" y="150" width="200" height="120" rx="8" stroke="#6B3FC4" stroke-width="3"/>
  <text class="boxTitle" x="284" y="175">① Plan declaration</text>
  <text class="boxMeta" x="284" y="196">metric · denominator · grouping</text>
  <text class="boxMeta" x="284" y="214">chart family · answerable?</text>
  <text class="boxMeta" x="284" y="232">→ plan.json</text>
  <text class="accent" x="284" y="256">run as an arm: with / without</text>

  <rect class="model" x="502" y="150" width="300" height="120" rx="8"/>
  <text class="boxTitle" x="516" y="175">② Analysis run</text>
  <text class="boxMeta" x="516" y="196">writes and runs code, sees errors and numbers,</text>
  <text class="boxMeta" x="516" y="214">fixes crashes, writes the answer</text>
  <text class="boxMeta" x="516" y="232">→ trace (steps, tools, code, tokens)</text>
  <text class="boxMeta" x="516" y="250">+ figure.json from the savefig hook</text>

  <rect class="io" x="834" y="150" width="230" height="120" rx="8"/>
  <text class="boxTitle" x="848" y="175">③ Artifacts</text>
  <text class="boxMeta" x="848" y="196">chart.png · values.csv · code</text>
  <text class="boxMeta" x="848" y="214">ANSWER (written)</text>
  <text class="boxMeta" x="848" y="232">D: options.json + k charts</text>

  <rect class="ghost" x="1096" y="150" width="300" height="120" rx="8"/>
  <text class="boxTitle" x="1110" y="175">④ Review → ⑤ Revise (arm B)</text>
  <text class="boxMeta" x="1110" y="196">read-only reviewer: CHART CHECK · ISSUES ·</text>
  <text class="boxMeta" x="1110" y="214">UNVERIFIED; reviser gets ISSUES only</text>
  <text class="boxMeta" x="1110" y="232">→ review.json · changes.json · revised files</text>
  <text class="boxMeta" x="1110" y="250">generator × reviewer: mimo / GPT-6 Luna</text>

  <rect class="io" x="1428" y="150" width="320" height="120" rx="8"/>
  <text class="boxTitle" x="1442" y="175">Records per run (exist)</text>
  <text class="boxMeta" x="1442" y="196">meta.json: prompt + config hashes, model,</text>
  <text class="boxMeta" x="1442" y="214">interpreter, steps, tokens, end state</text>
  <text class="boxMeta" x="1442" y="232">contract check (budget, sandbox, format)</text>
  <text class="boxMeta" x="1442" y="250">net_calls = 0 audit</text>

  <path class="line" d="M238,210 L266,210" marker-end="url(#arrow)"/>
  <path class="line" d="M470,210 L498,210" marker-end="url(#arrow)"/>
  <path class="line" d="M802,210 L830,210" marker-end="url(#arrow)"/>
  <path class="line" d="M1064,210 L1092,210" marker-end="url(#arrow)"/>
  <path class="line" d="M1396,210 L1424,210" marker-end="url(#arrow)"/>

  <!-- ===== Layer 2: checks ===== -->
  <rect x="30" y="316" width="1740" height="330" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>
  <text class="lane" x="48" y="346">Layer 2 · checks, one per observation point (code first, judge second, human last)</text>

  <!-- column headers aligned under layer-1 boxes -->
  <!-- Plan checks -->
  <rect class="code" x="270" y="366" width="200" height="120" rx="8"/>
  <rect x="276" y="372" width="10" height="10" class="build"/>
  <text class="boxTitle" x="292" y="382">Plan vs gold plan</text>
  <text class="boxMeta" x="284" y="403">denominator, grouping,</text>
  <text class="boxMeta" x="284" y="420">answerable = gold?</text>
  <text class="boxMeta" x="284" y="440">Framing check: undisclosed</text>
  <text class="boxMeta" x="284" y="457">filters, denominators that change</text>
  <text class="boxMeta" x="284" y="474">meaning (trap catalog)</text>

  <!-- Trace / figure checks -->
  <rect class="code" x="502" y="366" width="300" height="120" rx="8"/>
  <rect x="508" y="372" width="10" height="10" class="have"/>
  <text class="boxTitle" x="524" y="382">Contract + chart introspection</text>
  <text class="boxMeta" x="516" y="403">budget, sandbox, format, end state (exists)</text>
  <text class="boxMeta" x="516" y="421">figure.json: chart type, bar/line data =</text>
  <text class="boxMeta" x="516" y="438">values.csv, axis from 0, label overlaps</text>
  <text class="small" x="516" y="458">prototyped: flags a y-axis starting at 70,</text>
  <text class="small" x="516" y="474">the miss a frontier reviewer made</text>

  <!-- Artifact checks -->
  <rect class="code" x="834" y="366" width="230" height="56" rx="8"/>
  <rect x="840" y="372" width="10" height="10" class="have"/>
  <text class="boxTitle" x="856" y="382">values.csv vs gold</text>
  <text class="boxMeta" x="848" y="401">key-aware, tolerance (DABstep-style)</text>
  <text class="boxMeta" x="848" y="416">all 16 gold series re-derived</text>

  <rect class="judge" x="834" y="430" width="230" height="56" rx="8"/>
  <rect x="840" y="436" width="10" height="10" class="build"/>
  <text class="boxTitle" x="856" y="446">Claims in the ANSWER</text>
  <text class="boxMeta" x="848" y="465">executed check per quantified claim</text>
  <text class="boxMeta" x="848" y="480">(STAT-TO-TEXT); unsupported-claim judge</text>

  <!-- Review checks -->
  <rect class="code" x="1096" y="366" width="300" height="56" rx="8"/>
  <rect x="1102" y="372" width="10" height="10" class="build"/>
  <text class="boxTitle" x="1118" y="382">Reviewer recall by fault injection</text>
  <text class="boxMeta" x="1110" y="401">plant 20–30 known faults into correct outputs;</text>
  <text class="boxMeta" x="1110" y="416">recall per reviewer and per fault type</text>

  <rect class="human" x="1096" y="430" width="300" height="56" rx="8"/>
  <rect x="1102" y="436" width="10" height="10" class="have"/>
  <text class="boxTitle" x="1118" y="446">Two human checks per review</text>
  <text class="boxMeta" x="1110" y="465">invented an issue? changed something not</text>
  <text class="boxMeta" x="1110" y="480">flagged? (check_contract --show)</text>

  <!-- Final-view scoring -->
  <rect class="judge" x="1428" y="366" width="320" height="120" rx="8"/>
  <rect x="1434" y="372" width="10" height="10" class="build"/>
  <text class="boxTitle" x="1450" y="382">Final view: 8 binary criteria</text>
  <text class="boxMeta" x="1442" y="403">clear Qs: code (gold match, figure checks)</text>
  <text class="boxMeta" x="1442" y="420">ambiguous Qs: per-question rubric written by</text>
  <text class="boxMeta" x="1442" y="437">a human, graded by the frontier model</text>
  <text class="boxMeta" x="1442" y="454">insufficient Qs: abstain judge + claim checks</text>
  <text class="boxMeta" x="1442" y="471">aesthetics, disagreements, freeze: human</text>

  <!-- Judge rule banner -->
  <rect x="48" y="500" width="1700" height="40" rx="8" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.4"/>
  <text class="boxTitle" x="62" y="525">Judge rule:</text>
  <text class="boxMeta" x="150" y="525">no judge scores anything until its TPR and TNR are measured on ≥ 60 human labels (untouched test split). Measured so far: claim judge TPR 0.57 / TNR 1.00 on 32 sentences → a flagging aid, not a scorer, until recall ≥ 0.8.</text>

  <!-- Silent error definition -->
  <rect x="48" y="552" width="1700" height="80" rx="8" fill="#FFFFFF" stroke="#4F8A2E" stroke-width="1.4"/>
  <text class="boxTitle" x="62" y="576">Primary metric · silent-error rate of a run =</text>
  <text class="boxMeta" x="62" y="598">unsourced number  ∨  unsupported claim (cause, exposure-less risk, external fact)  ∨  gold mismatch  ∨  misleading framing (undisclosed exclusion or a denominator whose meaning changes in the window)</text>
  <text class="small" x="62" y="620">Phase-1 evidence for the fourth term: correct numbers with a Brooklyn filter that silently drops 20–38% of crashes (TR05, 6/6 runs), and per-crash rates across the 2020 recording change (TR01). No existing check catches it; no published scorer exists for it.</text>

  <!-- ===== Layer 3: the loop ===== -->
  <rect x="30" y="662" width="1740" height="250" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>
  <text class="lane" x="48" y="692">Layer 3 · the improvement loop (Husain &amp; Shankar error analysis · LangChain "one change at a time" · Anthropic capability → regression evals · Miller 2024 statistics)</text>

  <rect class="code" x="48" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="60" y="736">1 Freeze + run</text>
  <text class="boxMeta" x="60" y="756">prompts/config hashed,</text>
  <text class="boxMeta" x="60" y="772">K ≥ 5 runs per item,</text>
  <text class="boxMeta" x="60" y="788">traces logged</text>

  <rect class="code" x="258" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="270" y="736">2 Score every run</text>
  <text class="boxMeta" x="270" y="756">layer-2 checks →</text>
  <text class="boxMeta" x="270" y="772">per-step pass / fail record</text>
  <text class="boxMeta" x="270" y="788">(re-scorable without re-running)</text>

  <rect class="human" x="468" y="712" width="210" height="90" rx="8"/>
  <text class="boxTitle" x="480" y="736">3 Error analysis</text>
  <text class="boxMeta" x="480" y="756">humans open-code ≥ 30 traces,</text>
  <text class="boxMeta" x="480" y="772">name the first failing step,</text>
  <text class="boxMeta" x="480" y="788">taxonomy with counts</text>

  <rect class="human" x="698" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="710" y="736">4 One change</text>
  <text class="boxMeta" x="710" y="756">top failure → hypothesis →</text>
  <text class="boxMeta" x="710" y="772">one prompt line / context</text>
  <text class="boxMeta" x="710" y="788">item / harness rule</text>

  <rect class="code" x="908" y="712" width="210" height="90" rx="8"/>
  <text class="boxTitle" x="920" y="736">5 Paired re-run</text>
  <text class="boxMeta" x="920" y="756">same items, same K; per-item</text>
  <text class="boxMeta" x="920" y="772">differences, Wilson intervals,</text>
  <text class="boxMeta" x="920" y="788">pass@K and pass^K, MDE stated</text>

  <rect class="code" x="1138" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="1150" y="736">6 Gate</text>
  <text class="boxMeta" x="1150" y="756">keep iff target failure</text>
  <text class="boxMeta" x="1150" y="772">improves and the regression</text>
  <text class="boxMeta" x="1150" y="788">set does not regress; else revert</text>

  <rect class="human" x="1348" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="1360" y="736">7 Log + re-validate</text>
  <text class="boxMeta" x="1360" y="756">change entry; judge TPR/TNR</text>
  <text class="boxMeta" x="1360" y="772">on the untouched test split;</text>
  <text class="boxMeta" x="1360" y="788">field guide</text>

  <rect class="human" x="1558" y="712" width="190" height="90" rx="8"/>
  <text class="boxTitle" x="1570" y="736">8 Freeze or stop</text>
  <text class="boxMeta" x="1570" y="756">held-out P1–P10 run once</text>
  <text class="boxMeta" x="1570" y="772">per freeze candidate; stop</text>
  <text class="boxMeta" x="1570" y="788">when taxonomy saturates</text>

  <path class="line" d="M238,757 L254,757" marker-end="url(#arrow)"/>
  <path class="line" d="M448,757 L464,757" marker-end="url(#arrow)"/>
  <path class="line" d="M678,757 L694,757" marker-end="url(#arrow)"/>
  <path class="line" d="M888,757 L904,757" marker-end="url(#arrow)"/>
  <path class="line" d="M1118,757 L1134,757" marker-end="url(#arrow)"/>
  <path class="line" d="M1328,757 L1344,757" marker-end="url(#arrow)"/>
  <path class="line" d="M1538,757 L1554,757" marker-end="url(#arrow)"/>
  <path class="lineP" d="M1233,802 L1233,830 L143,830 L143,806" marker-end="url(#arrowP)"/>
  <text class="accent" x="600" y="846">revert → next failure class; dev set = 6 pilot questions (screens, MDE ≈ 30 pp at K = 5); held-out = 10 formal questions (confirmation only)</text>

  <text class="small" x="48" y="880">Humans do steps 3, 4, 7, 8 (every practitioner standard mandates it; automated optimizers assume a validated metric and hundreds of labelled items, which these steps produce). Code does 1, 2, 5, 6.</text>
  <text class="small" x="48" y="898">Report format for Ryan: one row per change · quality ↑↓→ · cost ↑↓→ · time ↑↓→ · numbers beneath.</text>

  <!-- ===== Experiments ===== -->
  <rect x="30" y="928" width="1740" height="130" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text class="lane" x="48" y="956">What phase 2 runs through the layer</text>
  <text class="boxTitle" x="48" y="982">E010 · silent-error oracle</text>
  <text class="boxMeta" x="48" y="1000">build the layer; score all phase-1 runs without</text>
  <text class="boxMeta" x="48" y="1016">re-running; taxonomy; regression set; arrows table</text>
  <text class="boxTitle" x="520" y="982">E008 · who should review? (generator × reviewer, 2 × 2)</text>
  <text class="boxMeta" x="520" y="1000">mimo / Luna in each role, same frozen prompts; silent-error rate per cell;</text>
  <text class="boxMeta" x="520" y="1016">reviewer recall by fault injection; capability vs prompt attribution</text>
  <text class="boxTitle" x="1120" y="982">E009 · enumerate (VS) + plan-declaration arm</text>
  <text class="boxMeta" x="1120" y="1000">k = 3 framings scored as a set (accuracy gate, distinct, coverage,</text>
  <text class="boxMeta" x="1120" y="1016">mode share); plan declaration as with / without arm</text>
  <text class="small" x="48" y="1044">Assets in hand: 70+ traced runs (2 models × 4 arms × 6 questions, D × 3 repeats), 16 verified gold series, trap sheet, frozen prompts, contract checker, figure-introspection prototype, 32-sentence judge calibration set.</text>
</svg>
