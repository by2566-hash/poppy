<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1010" width="1800" height="1010" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/>
    </marker>
    <marker id="arrowGhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5B5B5"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #1F1F1F; }
      .subtitle { font-size: 15px; fill: #5A5A5A; }
      .laneLetter { font-size: 34px; font-weight: 800; fill: #1F1F1F; }
      .laneName { font-size: 17px; font-weight: 700; fill: #1F1F1F; }
      .laneMeta { font-size: 13px; fill: #5A5A5A; }
      .boxTitle { font-size: 16px; font-weight: 700; fill: #1F1F1F; }
      .boxMeta { font-size: 12.5px; fill: #4A4A4A; }
      .ghostText { font-size: 16px; font-weight: 700; fill: #A8A8A8; }
      .ghostMeta { font-size: 12.5px; fill: #A0A0A0; }
      .edge { font-size: 12px; fill: #3A3A3A; }
      .accent { font-size: 12.5px; font-weight: 700; fill: #6B3FC4; }
      .chipTitle { font-size: 15px; font-weight: 700; fill: #1F1F1F; }
      .chipText { font-size: 13px; fill: #4A4A4A; }
      .legend { font-size: 13px; fill: #3A3A3A; }
      .io { fill: #FFFFFF; stroke: #9A9A9A; stroke-width: 1.3; }
      .model { fill: #E8F0FE; stroke: #3B6FD8; stroke-width: 1.6; }
      .python { fill: #EDF5E8; stroke: #4F8A2E; stroke-width: 1.6; }
      .human { fill: #FFF3E3; stroke: #D9822B; stroke-width: 1.6; }
      .ghost { fill: #F6F6F6; stroke: #C4C4C4; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .record { fill: #F6F6F6; stroke: #9A9A9A; stroke-width: 1.3; stroke-dasharray: 4 3; }
      .changed { stroke: #6B3FC4; stroke-width: 3; }
      .line { stroke: #4A4A4A; stroke-width: 1.8; fill: none; }
      .lineGhost { stroke: #B5B5B5; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1800" height="1010" fill="#FFFFFF"/>

  <!-- Title -->
  <text class="title" x="40" y="56">Phase 1 — An analyst asks an AI agent: add a review step, or ask the agent to check itself?</text>
  <text class="subtitle" x="40" y="88">Same model, data file, questions, sandbox and step budget (≤ 15 steps, 600 s per run) in every arm. Boxes are runs or harness checks; arrows carry what the next box receives.</text>

  <!-- Lane backgrounds -->
  <rect x="30" y="120" width="1530" height="150" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>
  <rect x="30" y="290" width="1530" height="310" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>
  <rect x="30" y="620" width="1530" height="150" rx="10" fill="#FAFAFA" stroke="#E6E6E6"/>

  <!-- ===== Lane A ===== -->
  <text class="laneLetter" x="52" y="198">A</text>
  <text class="laneName" x="92" y="186">Baseline</text>
  <text class="laneMeta" x="92" y="208">1 run</text>

  <rect class="io" x="230" y="150" width="200" height="90" rx="8"/>
  <text class="boxTitle" x="246" y="182">Question</text>
  <text class="boxMeta" x="246" y="204">+ data dictionary</text>
  <text class="boxMeta" x="246" y="224">(prompt A.v1, frozen)</text>

  <rect class="model" x="470" y="140" width="400" height="110" rx="10"/>
  <text class="boxTitle" x="488" y="168">① Analysis run (agent)</text>
  <text class="boxMeta" x="488" y="192">The model writes and runs its own code, sees errors</text>
  <text class="boxMeta" x="488" y="212">and numbers, fixes crashes, then writes its answer.</text>
  <text class="boxMeta" x="488" y="232">Sees only its folder + the data file; no network.</text>

  <rect class="io" x="910" y="150" width="330" height="90" rx="8"/>
  <text class="boxTitle" x="926" y="180">A's output (the "before")</text>
  <text class="boxMeta" x="926" y="202">initial.png · values.csv · code</text>
  <text class="boxMeta" x="926" y="222">ANSWER: written answer</text>

  <path class="line" d="M430,195 L466,195" marker-end="url(#arrow)"/>
  <path class="line" d="M870,195 L906,195" marker-end="url(#arrow)"/>
  <path class="line" d="M1240,195 L1586,195" marker-end="url(#arrow)"/>

  <!-- ===== Lane B ===== -->
  <text class="laneLetter" x="52" y="368">B</text>
  <text class="laneName" x="92" y="356">Review step</text>
  <text class="laneMeta" x="92" y="378">up to 3 runs</text>

  <rect class="ghost" x="230" y="320" width="200" height="90" rx="8"/>
  <text class="ghostText" x="246" y="350">① = A's run</text>
  <text class="ghostMeta" x="246" y="372">reused, so every B item</text>
  <text class="ghostMeta" x="246" y="392">is a before/after pair</text>

  <rect class="python" x="460" y="320" width="170" height="90" rx="8"/>
  <text class="boxTitle" x="474" y="348">Gate 1</text>
  <text class="boxMeta" x="474" y="370">A has an ANSWER?</text>
  <text class="boxMeta" x="474" y="390">no → item fails in A and B</text>

  <rect class="model changed" x="660" y="310" width="440" height="125" rx="10"/>
  <text class="boxTitle" x="678" y="338">③ Review run — read-only</text>
  <text class="boxMeta" x="678" y="361">in: question, data dictionary, chart image (attached),</text>
  <text class="boxMeta" x="678" y="380">values.csv, written answer, code (all embedded)</text>
  <text class="boxMeta" x="678" y="400">out, text only: CHART CHECK · ISSUES · UNVERIFIED</text>
  <text class="accent" x="678" y="422">cannot run code, write files, open other files, go online</text>

  <rect class="python" x="1140" y="310" width="210" height="125" rx="8"/>
  <text class="boxTitle" x="1154" y="338">Gate 2: route review</text>
  <text class="boxMeta" x="1154" y="361">ISSUES: NONE → keep A's</text>
  <text class="boxMeta" x="1154" y="380">numbered list → ④ revise</text>
  <text class="boxMeta" x="1154" y="399">no ISSUES block → B fails</text>
  <text class="boxMeta" x="1154" y="418">(no revise run)</text>

  <rect class="record" x="230" y="470" width="400" height="100" rx="8"/>
  <text class="boxTitle" x="246" y="498">Recorded, not passed on</text>
  <text class="boxMeta" x="246" y="520">CHART CHECK (what it saw in the image) and</text>
  <text class="boxMeta" x="246" y="540">UNVERIFIED (would need the data file) → review.json,</text>
  <text class="boxMeta" x="246" y="560">so the review can be scored on its own</text>

  <rect class="model changed" x="660" y="460" width="440" height="125" rx="10"/>
  <text class="boxTitle" x="678" y="488">④ Revise run — the only step that changes things</text>
  <text class="boxMeta" x="678" y="511">in: question, dictionary, A's code, values, answer, ISSUES only</text>
  <text class="boxMeta" x="678" y="530">out: revised.png · revised_values.csv · ANSWER ·</text>
  <text class="boxMeta" x="678" y="549">CHANGES: one line per issue (fixed / kept / cannot address)</text>
  <text class="accent" x="678" y="571">same sandbox as ①; A's files read-only; unflagged parts unchanged</text>

  <rect class="io" x="1380" y="470" width="170" height="100" rx="8"/>
  <text class="boxTitle" x="1394" y="498">B's output</text>
  <text class="boxMeta" x="1394" y="520">revised files + ANSWER,</text>
  <text class="boxMeta" x="1394" y="540">or A's output if the</text>
  <text class="boxMeta" x="1394" y="560">review said NONE</text>

  <path class="lineGhost" d="M430,365 L456,365" marker-end="url(#arrowGhost)"/>
  <path class="line" d="M630,365 L656,365" marker-end="url(#arrow)"/>
  <path class="line" d="M1100,372 L1136,372" marker-end="url(#arrow)"/>
  <text class="edge" x="1103" y="362">text</text>
  <path class="lineGhost" d="M680,435 L680,452 L430,452 L430,466" marker-end="url(#arrowGhost)"/>
  <path class="line" d="M1245,435 L1245,492 L1104,492" marker-end="url(#arrow)"/>
  <text class="edge" x="1112" y="484">ISSUES only</text>
  <path class="line" d="M1350,345 L1465,345 L1465,466" marker-end="url(#arrow)"/>
  <text class="edge" x="1368" y="337">NONE</text>
  <path class="line" d="M1100,552 L1376,552" marker-end="url(#arrow)"/>
  <path class="line" d="M1550,520 L1586,520" marker-end="url(#arrow)"/>

  <!-- ===== Lane C ===== -->
  <text class="laneLetter" x="52" y="698">C</text>
  <text class="laneName" x="92" y="686">Self-check</text>
  <text class="laneMeta" x="92" y="708">1 run</text>

  <rect class="io" x="230" y="650" width="200" height="90" rx="8"/>
  <text class="boxTitle" x="246" y="682">Question</text>
  <text class="boxMeta" x="246" y="704">+ data dictionary</text>
  <text class="boxMeta" x="246" y="724">(same as A)</text>

  <rect class="model changed" x="470" y="640" width="400" height="110" rx="10"/>
  <text class="boxTitle" x="488" y="668">①′ Analysis run + self-check instruction</text>
  <text class="boxMeta" x="488" y="692">Same agent, sandbox, budget and output format as A.</text>
  <text class="boxMeta" x="488" y="712">Only the prompt changes (written after A and B</text>
  <text class="boxMeta" x="488" y="732">are frozen; no trap checklist).</text>

  <rect class="io" x="910" y="650" width="330" height="90" rx="8"/>
  <text class="boxTitle" x="926" y="680">C's output</text>
  <text class="boxMeta" x="926" y="702">initial.png · values.csv · code</text>
  <text class="boxMeta" x="926" y="722">ANSWER: written answer</text>

  <path class="line" d="M430,695 L466,695" marker-end="url(#arrow)"/>
  <path class="line" d="M870,695 L906,695" marker-end="url(#arrow)"/>
  <path class="line" d="M1240,695 L1586,695" marker-end="url(#arrow)"/>

  <!-- ===== Evaluate ===== -->
  <rect class="human" x="1590" y="120" width="180" height="650" rx="10"/>
  <text class="boxTitle" x="1606" y="152">⑥ Evaluate</text>
  <text class="boxMeta" x="1606" y="176">code + humans</text>
  <text class="boxMeta" x="1606" y="214">• gold numbers (SQL)</text>
  <text class="boxMeta" x="1606" y="238">• blind 0–12 rubric,</text>
  <text class="boxMeta" x="1606" y="256">  arm labels hidden</text>
  <text class="boxMeta" x="1606" y="280">• B: review scored on</text>
  <text class="boxMeta" x="1606" y="298">  its own (review.json)</text>
  <text class="boxMeta" x="1606" y="322">• B: correct → wrong</text>
  <text class="boxMeta" x="1606" y="340">  flips</text>
  <text class="boxMeta" x="1606" y="364">• B: contract check</text>
  <text class="boxMeta" x="1606" y="382">  (check_contract.py)</text>
  <text class="boxMeta" x="1606" y="406">• cost: runs, steps,</text>
  <text class="boxMeta" x="1606" y="424">  tokens, time</text>
  <text class="boxMeta" x="1606" y="462">Intention-to-treat:</text>
  <text class="boxMeta" x="1606" y="480">an item with no answer</text>
  <text class="boxMeta" x="1606" y="498">scores 0 in that arm</text>

  <!-- ===== Bottom notes ===== -->
  <rect x="30" y="800" width="760" height="180" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text class="chipTitle" x="50" y="830">What each comparison measures</text>
  <text class="chipText" x="50" y="858">A → B: does an independent review (fresh context, sees the chart, cannot run code) plus a</text>
  <text class="chipText" x="50" y="878">revision add value on top of an agent that already runs its own code?</text>
  <text class="chipText" x="50" y="906">A → C: does telling the same agent to check its own work help? Only the prompt changes.</text>
  <text class="chipText" x="50" y="934">B vs C: build a review step, or ask the agent to check itself? Report quality next to cost;</text>
  <text class="chipText" x="50" y="954">B uses up to 3 runs per item, A and C use 1.</text>

  <rect x="810" y="800" width="760" height="180" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text class="chipTitle" x="830" y="830">Boundaries (enforced by config and the OS sandbox, tested)</text>
  <text class="chipText" x="830" y="858">• Every run sees only its own folder and its own copy of the data file; no internet.</text>
  <text class="chipText" x="830" y="882">• python / ls / cat / head / mkdir run under macOS sandbox-exec: no network, no reading</text>
  <text class="chipText" x="830" y="902">  the repo (gold answers, docs) or other runs, writing only inside the run folder.</text>
  <text class="chipText" x="830" y="926">• ③ runs in its own folder with a read-only config, so it cannot inherit ①'s permissions.</text>
  <text class="chipText" x="830" y="950">• ④ cannot overwrite A's initial.png / values.csv, so the "before" stays intact.</text>

  <!-- Legend -->
  <rect class="model" x="1590" y="808" width="22" height="16" rx="3"/>
  <text class="legend" x="1620" y="821">model run</text>
  <rect class="python" x="1590" y="836" width="22" height="16" rx="3"/>
  <text class="legend" x="1620" y="849">harness check</text>
  <rect class="human" x="1590" y="864" width="22" height="16" rx="3"/>
  <text class="legend" x="1620" y="877">evaluation</text>
  <rect class="io" x="1590" y="892" width="22" height="16" rx="3"/>
  <text class="legend" x="1620" y="905">artifacts</text>
  <rect x="1590" y="920" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#6B3FC4" stroke-width="3"/>
  <text class="legend" x="1620" y="933">differs from A</text>
</svg>
